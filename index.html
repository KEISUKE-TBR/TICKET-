<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Card Studio</title>
<style>
:root{
  --bg:#1e1e1e;--panel:#252525;--panel2:#2d2d2d;--line:#3b3b3b;--text:#f3f3f3;
  --muted:#aaa;--accent:#6c8cff;--danger:#ff6b6b;--canvas:#353535;--input:#1f1f1f;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;font-family:Inter,"Noto Sans JP",system-ui,sans-serif;background:var(--bg);color:var(--text)}
button,input,select,textarea{font:inherit}
button{background:var(--panel2);color:var(--text);border:1px solid var(--line);border-radius:6px;padding:7px 10px;cursor:pointer}
button:hover{border-color:#666}
button.active{background:var(--accent);border-color:var(--accent)}
button.danger{color:#ffb0b0}
input,select,textarea{width:100%;background:var(--input);color:var(--text);border:1px solid var(--line);border-radius:5px;padding:6px}
textarea{min-height:70px;resize:vertical}
.app{height:100%;display:grid;grid-template-rows:44px 1fr 28px}
.topbar{display:flex;align-items:center;gap:8px;padding:5px 8px;background:#202020;border-bottom:1px solid var(--line)}
.brand{font-weight:800;margin-right:12px;letter-spacing:.03em}
.spacer{flex:1}
.workspace{display:grid;grid-template-columns:230px 1fr 290px;min-height:0}
.sidebar,.inspector{background:var(--panel);overflow:auto}
.sidebar{border-right:1px solid var(--line)}
.inspector{border-left:1px solid var(--line)}
.panel-title{font-size:12px;font-weight:700;color:#ddd;padding:10px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
.section{padding:10px 12px;border-bottom:1px solid var(--line)}
.field{margin-bottom:9px}
.field label{display:block;font-size:11px;color:var(--muted);margin-bottom:4px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:7px}
.tabs{display:flex;border-bottom:1px solid var(--line)}
.tabs button{flex:1;border:0;border-radius:0;padding:9px 4px;font-size:11px;background:transparent}
.tabs button.active{background:#333;color:white}
.tab-panel{display:none}.tab-panel.active{display:block}
.layer{display:flex;align-items:center;gap:7px;padding:7px 8px;border-bottom:1px solid #333;cursor:pointer;font-size:12px}
.layer.selected{background:#3a435d}
.layer .eye{width:20px;text-align:center;color:#bbb}
.layer .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.canvas-wrap{position:relative;overflow:hidden;background:var(--canvas)}
.viewport{position:absolute;inset:0;overflow:hidden}
.world{position:absolute;left:50%;top:50%;transform-origin:0 0}
.artboard{
  position:absolute;background:white;box-shadow:0 0 0 1px rgba(255,255,255,.15),0 15px 45px rgba(0,0,0,.35);
  transform-origin:0 0;overflow:hidden
}
.obj{position:absolute;user-select:none;transform-origin:center center}
.obj.selected{outline:1px solid var(--accent);outline-offset:1px}
.handle{position:absolute;width:8px;height:8px;background:white;border:1px solid var(--accent);border-radius:2px;z-index:5}
.handle.br{right:-5px;bottom:-5px;cursor:nwse-resize}
.handle.rotate{width:9px;height:9px;border-radius:50%;left:50%;top:-24px;transform:translateX(-50%);cursor:grab}
.text-node{width:100%;height:100%;white-space:pre-wrap;overflow:hidden;display:flex}
.image-node{width:100%;height:100%;display:block}
.shape-node{width:100%;height:100%}
.statusbar{display:flex;align-items:center;gap:16px;padding:0 10px;background:#202020;border-top:1px solid var(--line);font-size:11px;color:var(--muted)}
.zoom-box{display:flex;align-items:center;gap:4px}
.hint{font-size:11px;color:var(--muted);line-height:1.5}
.row{display:flex;gap:6px;align-items:center}
.wrap{flex-wrap:wrap}
.palette{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.palette button{padding:12px 5px}
.page-list .page{padding:8px;border-bottom:1px solid #333;font-size:12px;cursor:pointer}
.page.selected{background:#39405a}
.badge{display:inline-block;padding:2px 5px;border-radius:999px;background:#3b3b3b;color:#ccc;font-size:10px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);display:none;align-items:center;justify-content:center;z-index:20}
.modal.open{display:flex}
.modal-card{width:min(900px,92vw);max-height:88vh;overflow:auto;background:#252525;border:1px solid #444;border-radius:10px;padding:16px}
.print-sheet{position:relative;width:210mm;height:297mm;background:white;page-break-after:always}
.print-card{position:absolute;width:86mm;height:54mm;overflow:hidden;background:white}
.print-el{position:absolute;transform-origin:center center}
@media print{
  body>*:not(#printRoot){display:none!important}
  #printRoot{display:block!important}
  @page{size:A4 portrait;margin:0}
  .print-sheet{margin:0;box-shadow:none}
}
#toast{position:fixed;right:16px;bottom:42px;background:#111;border:1px solid #555;padding:9px 12px;border-radius:7px;display:none;z-index:30}
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">Card Studio</div>
    <button id="newBtn">新規</button>
    <button id="undoBtn">↶</button>
    <button id="redoBtn">↷</button>
    <span style="width:1px;height:26px;background:#444"></span>
    <button class="tool active" data-tool="select">選択</button>
    <button class="tool" data-tool="text">文字</button>
    <button class="tool" data-tool="rect">四角</button>
    <button class="tool" data-tool="ellipse">円</button>
    <button class="tool" data-tool="line">線</button>
    <button id="imageBtn">画像</button>
    <input id="imageInput" type="file" accept="image/*" hidden>
    <div class="spacer"></div>
    <button id="saveBtn">保存</button>
    <button id="loadBtn">開く</button>
    <input id="loadInput" type="file" accept=".cardstudio,.json" hidden>
    <button id="csvBtn">CSV</button>
    <input id="csvInput" type="file" accept=".csv,.tsv,text/csv" hidden>
    <button id="previewBtn">差し込み確認</button>
    <button id="printBtn">印刷</button>
  </header>

  <main class="workspace">
    <aside class="sidebar">
      <div class="tabs">
        <button class="left-tab active" data-tab="layers">レイヤー</button>
        <button class="left-tab" data-tab="pages">ページ</button>
        <button class="left-tab" data-tab="data">データ</button>
      </div>
      <div id="tab-layers" class="tab-panel active">
        <div class="panel-title">レイヤー <span class="badge" id="layerCount">0</span></div>
        <div id="layerList"></div>
        <div class="section">
          <div class="row wrap">
            <button id="frontBtn">前面</button><button id="backBtn">背面</button>
            <button id="dupBtn">複製</button><button id="deleteBtn" class="danger">削除</button>
          </div>
        </div>
      </div>
      <div id="tab-pages" class="tab-panel">
        <div class="panel-title">カード面</div>
        <div class="page-list">
          <div class="page selected">表面</div>
        </div>
        <div class="section hint">この基礎版は1面編集です。両面機能は次段階で追加できます。</div>
      </div>
      <div id="tab-data" class="tab-panel">
        <div class="panel-title">差し込みデータ</div>
        <div class="section">
          <div id="dataSummary" class="hint">CSV未読込</div>
          <div class="field"><label>プレビュー行</label><select id="rowSelect"></select></div>
          <div class="hint">文字に <b>{{sender}}</b>、<b>{{message}}</b>、<b>{{id}}</b> などを書いて差し込みます。</div>
        </div>
      </div>
    </aside>

    <section class="canvas-wrap" id="canvasWrap">
      <div class="viewport" id="viewport">
        <div class="world" id="world">
          <div class="artboard" id="artboard"></div>
        </div>
      </div>
    </section>

    <aside class="inspector">
      <div class="tabs">
        <button class="right-tab active" data-tab="design">デザイン</button>
        <button class="right-tab" data-tab="layout">配置</button>
        <button class="right-tab" data-tab="document">文書</button>
      </div>

      <div id="tab-design" class="tab-panel active">
        <div id="nothingSelected" class="section hint">要素を選択してください。</div>
        <div id="selectionPanel" style="display:none">
          <div class="panel-title">選択要素</div>
          <div class="section">
            <div class="field"><label>名前</label><input id="pName"></div>
            <div id="textProps" style="display:none">
              <div class="field"><label>テキスト</label><textarea id="pText"></textarea></div>
              <div class="field"><label>Google Font</label>
                <select id="pFont">
                  <option>Noto Sans JP</option><option>Noto Serif JP</option>
                  <option>M PLUS 1p</option><option>M PLUS Rounded 1c</option>
                  <option>Zen Kaku Gothic New</option><option>Zen Old Mincho</option>
                  <option>Shippori Mincho</option><option>Kosugi Maru</option>
                  <option>Montserrat</option><option>Playfair Display</option>
                </select>
              </div>
              <div class="grid2">
                <div class="field"><label>サイズ pt</label><input id="pFontSize" type="number" step=".25"></div>
                <div class="field"><label>太さ</label><select id="pWeight"><option>300</option><option>400</option><option>500</option><option>600</option><option>700</option><option>800</option><option>900</option></select></div>
                <div class="field"><label>字間 em</label><input id="pLetter" type="number" step=".01"></div>
                <div class="field"><label>行間</label><input id="pLine" type="number" step=".05"></div>
              </div>
              <div class="grid2">
                <div class="field"><label>文字色</label><input id="pColor" type="color"></div>
                <div class="field"><label>揃え</label><select id="pAlign"><option value="left">左</option><option value="center">中央</option><option value="right">右</option><option value="justify">両端</option></select></div>
              </div>
            </div>
            <div id="shapeProps" style="display:none">
              <div class="grid2">
                <div class="field"><label>塗り</label><input id="pFill" type="color"></div>
                <div class="field"><label>線</label><input id="pStroke" type="color"></div>
                <div class="field"><label>線幅 mm</label><input id="pStrokeWidth" type="number" step=".1"></div>
                <div class="field"><label>角丸 mm</label><input id="pRadius" type="number" step=".1"></div>
              </div>
            </div>
            <div id="imageProps" style="display:none">
              <div class="field"><label>表示方法</label><select id="pFit"><option value="contain">全体表示</option><option value="cover">トリミング</option><option value="fill">変形</option></select></div>
            </div>
          </div>
        </div>
      </div>

      <div id="tab-layout" class="tab-panel">
        <div class="section">
          <div class="grid2">
            <div class="field"><label>X mm</label><input id="pX" type="number" step=".1"></div>
            <div class="field"><label>Y mm</label><input id="pY" type="number" step=".1"></div>
            <div class="field"><label>幅 mm</label><input id="pW" type="number" step=".1"></div>
            <div class="field"><label>高さ mm</label><input id="pH" type="number" step=".1"></div>
            <div class="field"><label>回転 °</label><input id="pRotation" type="number" step="1"></div>
            <div class="field"><label>透明度 %</label><input id="pOpacity" type="number" min="0" max="100"></div>
          </div>
          <div class="row wrap">
            <button id="alignLeft">左揃え</button><button id="alignCenter">中央</button><button id="alignRight">右揃え</button>
          </div>
        </div>
      </div>

      <div id="tab-document" class="tab-panel">
        <div class="section">
          <div class="field"><label>カード方向</label>
            <select id="orientation">
              <option value="landscape">横（86×54mm）</option>
              <option value="portrait">縦（54×86mm）</option>
            </select>
          </div>
          <div class="field"><label>カード背景</label><input id="docBg" type="color"></div>
          <div class="field"><label>印刷時の回転</label>
            <select id="printRotation">
              <option value="auto">自動</option><option value="0">0°</option><option value="90">90°</option><option value="180">180°</option><option value="270">270°</option>
            </select>
          </div>
          <div class="hint">縦カードはデザイン画面では54×86mm。ELECOM用紙へ面付けするときだけ自動で90°回転します。</div>
        </div>
      </div>
    </aside>
  </main>

  <footer class="statusbar">
    <div id="status">準備完了</div>
    <div class="spacer"></div>
    <div class="zoom-box"><button id="zoomOut">−</button><span id="zoomLabel">100%</span><button id="zoomIn">＋</button><button id="fitBtn">全体</button></div>
  </footer>
</div>

<div id="previewModal" class="modal">
  <div class="modal-card">
    <div class="row"><h2 style="margin:0">差し込みプレビュー</h2><div class="spacer"></div><button id="closePreview">閉じる</button></div>
    <div id="previewGrid" style="display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px;margin-top:16px"></div>
  </div>
</div>
<div id="printRoot" style="display:none"></div>
<div id="toast"></div>

<script>
const MM=3.7795275591;
const $=id=>document.getElementById(id);
const uid=()=>crypto.randomUUID?.()||Math.random().toString(36).slice(2);
const clone=o=>JSON.parse(JSON.stringify(o));
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

const state={
  doc:{orientation:"landscape",width:86,height:54,bg:"#ffffff",printRotation:"auto"},
  objects:[],
  selected:null,
  tool:"select",
  zoom:1,
  panX:0,panY:0,
  history:[],future:[],
  data:[],rowIndex:0
};

const googleFonts=new Set();
function loadFont(name){
  if(!name||googleFonts.has(name))return;
  googleFonts.add(name);
  const link=document.createElement("link");
  link.rel="stylesheet";
  link.href="https://fonts.googleapis.com/css2?family="+encodeURIComponent(name).replace(/%20/g,"+")+":wght@300;400;500;600;700;800;900&display=swap";
  document.head.appendChild(link);
}
["Noto Sans JP","Noto Serif JP"].forEach(loadFont);

function snapshot(){
  state.history.push(JSON.stringify({doc:state.doc,objects:state.objects}));
  if(state.history.length>100)state.history.shift();
  state.future=[];
}
function restore(s){
  const o=JSON.parse(s);state.doc=o.doc;state.objects=o.objects;state.selected=null;renderAll();
}
function undo(){
  if(!state.history.length)return;
  state.future.push(JSON.stringify({doc:state.doc,objects:state.objects}));
  restore(state.history.pop());
}
function redo(){
  if(!state.future.length)return;
  state.history.push(JSON.stringify({doc:state.doc,objects:state.objects}));
  restore(state.future.pop());
}

function currentRow(){return state.data[state.rowIndex]||{}}
function mergeText(text,row=currentRow()){
  return String(text||"").replace(/\{\{\s*([^}]+?)\s*\}\}/g,(_,k)=>row[k]??"");
}

function addObject(type,opts={}){
  snapshot();
  const base={id:uid(),type,name:type==="text"?"テキスト":type==="image"?"画像":type==="shape"?"図形":"要素",
    x:10,y:10,w:30,h:12,rotation:0,opacity:100,visible:true};
  if(type==="text")Object.assign(base,{text:"テキスト",font:"Noto Sans JP",fontSize:12,weight:400,letter:0,line:1.2,color:"#111111",align:"left"});
  if(type==="shape")Object.assign(base,{shape:"rect",fill:"#dbe7ff",stroke:"#5271ff",strokeWidth:.3,radius:0});
  if(type==="image")Object.assign(base,{src:"",fit:"contain",w:25,h:25});
  Object.assign(base,opts);
  state.objects.push(base);state.selected=base.id;renderAll();
}

function renderAll(){renderArtboard();renderLayers();renderInspector();renderStatus()}
function renderArtboard(){
  const a=$("artboard");
  a.innerHTML="";
  a.style.width=state.doc.width*MM+"px";
  a.style.height=state.doc.height*MM+"px";
  a.style.background=state.doc.bg;
  a.style.transform=`scale(${state.zoom})`;
  a.style.left=-(state.doc.width*MM)/2+"px";
  a.style.top=-(state.doc.height*MM)/2+"px";
  $("world").style.transform=`translate(${state.panX}px,${state.panY}px)`;

  for(const o of state.objects){
    if(o.visible===false)continue;
    const n=document.createElement("div");
    n.className="obj"+(o.id===state.selected?" selected":"");
    n.dataset.id=o.id;
    Object.assign(n.style,{
      left:o.x*MM+"px",top:o.y*MM+"px",width:o.w*MM+"px",height:o.h*MM+"px",
      transform:`rotate(${o.rotation||0}deg)`,opacity:(o.opacity??100)/100
    });
    if(o.type==="text"){
      loadFont(o.font);
      const t=document.createElement("div");t.className="text-node";t.textContent=mergeText(o.text);
      Object.assign(t.style,{fontFamily:`"${o.font}",sans-serif`,fontSize:o.fontSize+"pt",fontWeight:o.weight,
        letterSpacing:o.letter+"em",lineHeight:o.line,color:o.color,textAlign:o.align,alignItems:"flex-start"});
      n.appendChild(t);
    }else if(o.type==="shape"){
      const s=document.createElement("div");s.className="shape-node";
      Object.assign(s.style,{background:o.shape==="line"?"transparent":o.fill,borderColor:o.stroke,borderStyle:"solid",
        borderWidth:o.strokeWidth*MM+"px",borderRadius:o.shape==="ellipse"?"50%":o.radius*MM+"px"});
      if(o.shape==="line"){s.style.height="0";s.style.borderLeft="0";s.style.borderRight="0";s.style.borderBottom="0";s.style.marginTop=(o.h*MM/2)+"px"}
      n.appendChild(s);
    }else if(o.type==="image"){
      const im=document.createElement("img");im.className="image-node";im.src=o.src;im.style.objectFit=o.fit||"contain";n.appendChild(im);
    }
    n.addEventListener("pointerdown",objectPointerDown);
    if(o.id===state.selected){
      const h=document.createElement("div");h.className="handle br";h.addEventListener("pointerdown",resizePointerDown);n.appendChild(h);
      const r=document.createElement("div");r.className="handle rotate";r.addEventListener("pointerdown",rotatePointerDown);n.appendChild(r);
    }
    a.appendChild(n);
  }
}
function renderLayers(){
  const list=$("layerList");list.innerHTML="";
  [...state.objects].reverse().forEach(o=>{
    const row=document.createElement("div");row.className="layer"+(o.id===state.selected?" selected":"");
    row.innerHTML=`<span class="eye">${o.visible===false?"○":"●"}</span><span class="name">${o.name}</span><span class="badge">${o.type}</span>`;
    row.onclick=()=>{state.selected=o.id;renderAll()};
    row.querySelector(".eye").onclick=e=>{e.stopPropagation();snapshot();o.visible=o.visible===false?true:false;renderAll()};
    list.appendChild(row);
  });
  $("layerCount").textContent=state.objects.length;
}
function selected(){return state.objects.find(o=>o.id===state.selected)}
function renderInspector(){
  const o=selected();
  $("nothingSelected").style.display=o?"none":"block";
  $("selectionPanel").style.display=o?"block":"none";
  if(!o)return;
  $("pName").value=o.name;$("pX").value=o.x;$("pY").value=o.y;$("pW").value=o.w;$("pH").value=o.h;
  $("pRotation").value=o.rotation||0;$("pOpacity").value=o.opacity??100;
  $("textProps").style.display=o.type==="text"?"block":"none";
  $("shapeProps").style.display=o.type==="shape"?"block":"none";
  $("imageProps").style.display=o.type==="image"?"block":"none";
  if(o.type==="text"){
    $("pText").value=o.text;$("pFont").value=o.font;$("pFontSize").value=o.fontSize;$("pWeight").value=o.weight;
    $("pLetter").value=o.letter;$("pLine").value=o.line;$("pColor").value=o.color;$("pAlign").value=o.align;
  }
  if(o.type==="shape"){
    $("pFill").value=o.fill;$("pStroke").value=o.stroke;$("pStrokeWidth").value=o.strokeWidth;$("pRadius").value=o.radius;
  }
  if(o.type==="image")$("pFit").value=o.fit||"contain";
  $("orientation").value=state.doc.orientation;$("docBg").value=state.doc.bg;$("printRotation").value=state.doc.printRotation;
}
function renderStatus(){
  $("zoomLabel").textContent=Math.round(state.zoom*100)+"%";
  $("status").textContent=`${state.doc.width}×${state.doc.height}mm / ${state.objects.length}要素`;
}
function updateSelected(prop,val){
  const o=selected();if(!o)return;
  snapshot();o[prop]=val;renderAll();
}
function bindProp(id,prop,type="string"){
  $(id).addEventListener("change",e=>updateSelected(prop,type==="number"?Number(e.target.value):e.target.value));
}
["pName","pText","pFont","pColor","pAlign","pFill","pStroke","pFit"].forEach(id=>{
  const map={pName:"name",pText:"text",pFont:"font",pColor:"color",pAlign:"align",pFill:"fill",pStroke:"stroke",pFit:"fit"};
  bindProp(id,map[id]);
});
["pX","pY","pW","pH","pRotation","pOpacity","pFontSize","pWeight","pLetter","pLine","pStrokeWidth","pRadius"].forEach(id=>{
  const map={pX:"x",pY:"y",pW:"w",pH:"h",pRotation:"rotation",pOpacity:"opacity",pFontSize:"fontSize",pWeight:"weight",pLetter:"letter",pLine:"line",pStrokeWidth:"strokeWidth",pRadius:"radius"};
  bindProp(id,map[id],"number");
});

let drag=null;
function objectPointerDown(e){
  e.stopPropagation();
  const id=e.currentTarget.dataset.id;
  if(state.tool!=="select"){return}
  state.selected=id;renderAll();
  const o=selected();snapshot();
  drag={kind:"move",sx:e.clientX,sy:e.clientY,x:o.x,y:o.y,id};
  window.addEventListener("pointermove",pointerMove);window.addEventListener("pointerup",pointerUp,{once:true});
}
function resizePointerDown(e){
  e.stopPropagation();const o=selected();snapshot();
  drag={kind:"resize",sx:e.clientX,sy:e.clientY,w:o.w,h:o.h,id:o.id};
  window.addEventListener("pointermove",pointerMove);window.addEventListener("pointerup",pointerUp,{once:true});
}
function rotatePointerDown(e){
  e.stopPropagation();const o=selected();snapshot();
  const rect=$("artboard").getBoundingClientRect();
  const cx=rect.left+(o.x+o.w/2)*MM*state.zoom,cy=rect.top+(o.y+o.h/2)*MM*state.zoom;
  drag={kind:"rotate",cx,cy,id:o.id};
  window.addEventListener("pointermove",pointerMove);window.addEventListener("pointerup",pointerUp,{once:true});
}
function pointerMove(e){
  if(!drag)return;const o=state.objects.find(x=>x.id===drag.id);if(!o)return;
  if(drag.kind==="move"){
    o.x=clamp(drag.x+(e.clientX-drag.sx)/(MM*state.zoom),0,state.doc.width-o.w);
    o.y=clamp(drag.y+(e.clientY-drag.sy)/(MM*state.zoom),0,state.doc.height-o.h);
  }else if(drag.kind==="resize"){
    o.w=Math.max(2,drag.w+(e.clientX-drag.sx)/(MM*state.zoom));
    o.h=Math.max(2,drag.h+(e.clientY-drag.sy)/(MM*state.zoom));
  }else{
    o.rotation=Math.round(Math.atan2(e.clientY-drag.cy,e.clientX-drag.cx)*180/Math.PI+90);
  }
  renderAll();
}
function pointerUp(){drag=null;window.removeEventListener("pointermove",pointerMove)}

$("artboard").addEventListener("pointerdown",e=>{
  if(e.target!==$("artboard"))return;
  if(state.tool==="text")addObject("text",{x:12,y:12});
  else if(state.tool==="rect")addObject("shape",{shape:"rect",name:"四角形"});
  else if(state.tool==="ellipse")addObject("shape",{shape:"ellipse",name:"円",w:20,h:20});
  else if(state.tool==="line")addObject("shape",{shape:"line",name:"線",w:35,h:2});
  else{state.selected=null;renderAll()}
});
document.querySelectorAll(".tool").forEach(b=>b.onclick=()=>{
  document.querySelectorAll(".tool").forEach(x=>x.classList.remove("active"));
  b.classList.add("active");state.tool=b.dataset.tool;
});
document.querySelectorAll(".left-tab").forEach(b=>b.onclick=()=>switchTabs(".left-tab",b,"tab-"));
document.querySelectorAll(".right-tab").forEach(b=>b.onclick=()=>switchTabs(".right-tab",b,"tab-"));
function switchTabs(sel,b,prefix){
  document.querySelectorAll(sel).forEach(x=>x.classList.remove("active"));b.classList.add("active");
  const parent=b.closest("aside");parent.querySelectorAll(".tab-panel").forEach(x=>x.classList.remove("active"));
  parent.querySelector("#"+prefix+b.dataset.tab).classList.add("active");
}

$("imageBtn").onclick=()=>$("imageInput").click();
$("imageInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>addObject("image",{src:r.result,name:f.name});r.readAsDataURL(f);
};
$("deleteBtn").onclick=()=>{const i=state.objects.findIndex(o=>o.id===state.selected);if(i<0)return;snapshot();state.objects.splice(i,1);state.selected=null;renderAll()};
$("dupBtn").onclick=()=>{const o=selected();if(!o)return;snapshot();const n=clone(o);n.id=uid();n.name+=" コピー";n.x+=3;n.y+=3;state.objects.push(n);state.selected=n.id;renderAll()};
$("frontBtn").onclick=()=>{const i=state.objects.findIndex(o=>o.id===state.selected);if(i<0)return;snapshot();state.objects.push(state.objects.splice(i,1)[0]);renderAll()};
$("backBtn").onclick=()=>{const i=state.objects.findIndex(o=>o.id===state.selected);if(i<0)return;snapshot();state.objects.unshift(state.objects.splice(i,1)[0]);renderAll()};
$("undoBtn").onclick=undo;$("redoBtn").onclick=redo;
$("zoomIn").onclick=()=>{state.zoom=clamp(state.zoom+.1,.2,5);renderAll()};
$("zoomOut").onclick=()=>{state.zoom=clamp(state.zoom-.1,.2,5);renderAll()};
$("fitBtn").onclick=fitCanvas;
function fitCanvas(){
  const r=$("canvasWrap").getBoundingClientRect();
  state.zoom=Math.min((r.width-100)/(state.doc.width*MM),(r.height-100)/(state.doc.height*MM),2);
  state.panX=0;state.panY=0;renderAll();
}
$("orientation").onchange=e=>{
  snapshot();state.doc.orientation=e.target.value;
  if(e.target.value==="portrait"){state.doc.width=54;state.doc.height=86}else{state.doc.width=86;state.doc.height=54}
  renderAll();fitCanvas();
};
$("docBg").onchange=e=>{snapshot();state.doc.bg=e.target.value;renderAll()};
$("printRotation").onchange=e=>{state.doc.printRotation=e.target.value};
$("alignLeft").onclick=()=>updateSelected("x",0);
$("alignCenter").onclick=()=>{const o=selected();if(o)updateSelected("x",(state.doc.width-o.w)/2)};
$("alignRight").onclick=()=>{const o=selected();if(o)updateSelected("x",state.doc.width-o.w)};

$("saveBtn").onclick=()=>{
  const blob=new Blob([JSON.stringify({version:1,doc:state.doc,objects:state.objects},null,2)],{type:"application/json"});
  download(blob,"design.cardstudio");
};
$("loadBtn").onclick=()=>$("loadInput").click();
$("loadInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);snapshot();state.doc=o.doc;state.objects=o.objects;state.selected=null;renderAll();fitCanvas()}catch(err){toast("読み込み失敗")}};r.readAsText(f);
};
function download(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
$("csvBtn").onclick=()=>$("csvInput").click();
$("csvInput").onchange=e=>{
  const f=e.target.files[0];if(!f)return;const r=new FileReader();
  r.onload=()=>{state.data=parseCSV(r.result);state.rowIndex=0;renderData();renderAll();toast(state.data.length+"件読み込みました")};r.readAsText(f);
};
function parseCSV(t){
  const lines=t.replace(/\r/g,"").split("\n").filter(Boolean);if(!lines.length)return[];
  const parse=l=>{let a=[],s="",q=false;for(let i=0;i<l.length;i++){const c=l[i];if(c=='"'){if(q&&l[i+1]=='"'){s+='"';i++}else q=!q}else if(c==","&&!q){a.push(s);s=""}else s+=c}a.push(s);return a};
  const h=parse(lines[0]);return lines.slice(1).map(l=>Object.fromEntries(parse(l).map((v,i)=>[h[i]||("col"+i),v])));
}
function renderData(){
  $("dataSummary").textContent=state.data.length?`${state.data.length}件 / 列: ${Object.keys(state.data[0]).join(", ")}`:"CSV未読込";
  $("rowSelect").innerHTML=state.data.map((_,i)=>`<option value="${i}">${i+1}</option>`).join("");
}
$("rowSelect").onchange=e=>{state.rowIndex=Number(e.target.value);renderAll()};

$("previewBtn").onclick=()=>{
  const grid=$("previewGrid");grid.innerHTML="";
  const rows=state.data.length?state.data.slice(0,24):[{}];
  rows.forEach(row=>{
    const box=document.createElement("div");box.style.background="#444";box.style.padding="12px";box.style.borderRadius="8px";
    box.appendChild(renderCardDOM(row,260));grid.appendChild(box);
  });
  $("previewModal").classList.add("open");
};
$("closePreview").onclick=()=>$("previewModal").classList.remove("open");

function renderCardDOM(row,widthPx){
  const scale=widthPx/(state.doc.width*MM);
  const card=document.createElement("div");
  Object.assign(card.style,{position:"relative",width:widthPx+"px",height:state.doc.height*MM*scale+"px",background:state.doc.bg,overflow:"hidden"});
  state.objects.filter(o=>o.visible!==false).forEach(o=>{
    const n=document.createElement("div");Object.assign(n.style,{position:"absolute",left:o.x*MM*scale+"px",top:o.y*MM*scale+"px",
      width:o.w*MM*scale+"px",height:o.h*MM*scale+"px",transform:`rotate(${o.rotation||0}deg)`,opacity:(o.opacity??100)/100,transformOrigin:"center"});
    if(o.type==="text"){loadFont(o.font);n.textContent=mergeText(o.text,row);Object.assign(n.style,{fontFamily:`"${o.font}",sans-serif`,
      fontSize:o.fontSize*scale+"pt",fontWeight:o.weight,letterSpacing:o.letter+"em",lineHeight:o.line,color:o.color,textAlign:o.align,whiteSpace:"pre-wrap",overflow:"hidden"})}
    else if(o.type==="shape"){Object.assign(n.style,{background:o.shape==="line"?"transparent":o.fill,border:`${o.strokeWidth*MM*scale}px solid ${o.stroke}`,borderRadius:o.shape==="ellipse"?"50%":o.radius*MM*scale+"px"});if(o.shape==="line"){n.style.height="0";n.style.borderLeft="0";n.style.borderRight="0";n.style.borderBottom="0"}}
    else{const im=document.createElement("img");im.src=o.src;Object.assign(im.style,{width:"100%",height:"100%",objectFit:o.fit||"contain"});n.appendChild(im)}
    card.appendChild(n);
  });return card;
}

$("printBtn").onclick=()=>{
  buildPrint();setTimeout(()=>window.print(),300);
};
function buildPrint(){
  const root=$("printRoot");root.innerHTML="";root.style.display="block";
  const rows=state.data.length?state.data:[{}];
  const pos=[{x:14,y:25.5},{x:110,y:25.5},{x:14,y:89.5},{x:110,y:89.5},{x:14,y:153.5},{x:110,y:153.5},{x:14,y:217.5},{x:110,y:217.5}];
  for(let p=0;p<Math.ceil(rows.length/8);p++){
    const sheet=document.createElement("div");sheet.className="print-sheet";
    for(let i=0;i<8;i++){
      const row=rows[p*8+i];if(!row)continue;
      const slot=document.createElement("div");slot.className="print-card";slot.style.left=pos[i].x+"mm";slot.style.top=pos[i].y+"mm";
      const rot=state.doc.printRotation==="auto"?(state.doc.orientation==="portrait"?90:0):Number(state.doc.printRotation);
      const card=document.createElement("div");
      Object.assign(card.style,{position:"absolute",background:state.doc.bg,width:state.doc.width+"mm",height:state.doc.height+"mm",
        left:"50%",top:"50%",transform:`translate(-50%,-50%) rotate(${rot}deg)`,transformOrigin:"center",overflow:"hidden"});
      state.objects.filter(o=>o.visible!==false).forEach(o=>{
        const n=document.createElement("div");n.className="print-el";
        Object.assign(n.style,{left:o.x+"mm",top:o.y+"mm",width:o.w+"mm",height:o.h+"mm",transform:`rotate(${o.rotation||0}deg)`,opacity:(o.opacity??100)/100});
        if(o.type==="text"){loadFont(o.font);n.textContent=mergeText(o.text,row);Object.assign(n.style,{fontFamily:`"${o.font}",sans-serif`,fontSize:o.fontSize+"pt",fontWeight:o.weight,letterSpacing:o.letter+"em",lineHeight:o.line,color:o.color,textAlign:o.align,whiteSpace:"pre-wrap",overflow:"hidden"})}
        else if(o.type==="shape"){Object.assign(n.style,{background:o.shape==="line"?"transparent":o.fill,border:`${o.strokeWidth}mm solid ${o.stroke}`,borderRadius:o.shape==="ellipse"?"50%":o.radius+"mm"});if(o.shape==="line"){n.style.height="0";n.style.borderLeft="0";n.style.borderRight="0";n.style.borderBottom="0"}}
        else{const im=document.createElement("img");im.src=o.src;Object.assign(im.style,{width:"100%",height:"100%",objectFit:o.fit||"contain"});n.appendChild(im)}
        card.appendChild(n);
      });
      slot.appendChild(card);sheet.appendChild(slot);
    }
    root.appendChild(sheet);
  }
  setTimeout(()=>root.style.display="none",1500);
}

$("newBtn").onclick=()=>{if(!confirm("現在のデザインを消して新規作成しますか？"))return;snapshot();state.objects=[];state.doc={orientation:"landscape",width:86,height:54,bg:"#ffffff",printRotation:"auto"};renderAll();fitCanvas()};
$("canvasWrap").addEventListener("wheel",e=>{if(e.ctrlKey){e.preventDefault();state.zoom=clamp(state.zoom*(e.deltaY<0?1.1:.9),.2,5);renderAll()}},{passive:false});
window.addEventListener("keydown",e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();e.shiftKey?redo():undo()}
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="d"){e.preventDefault();$("dupBtn").click()}
  if(e.key==="Delete"||e.key==="Backspace"){if(document.activeElement.tagName!=="INPUT"&&document.activeElement.tagName!=="TEXTAREA")$("deleteBtn").click()}
});
function toast(t){const x=$("toast");x.textContent=t;x.style.display="block";setTimeout(()=>x.style.display="none",1800)}

addObject("shape",{name:"背景装飾",shape:"rect",x:4,y:4,w:78,h:46,fill:"#f5f1e8",stroke:"#f5f1e8",strokeWidth:0,radius:2});
addObject("text",{name:"贈り主",text:"{{sender}} 様",x:8,y:8,w:45,h:8,font:"Noto Serif JP",fontSize:12,weight:700});
addObject("text",{name:"メッセージ",text:"{{message}}",x:8,y:20,w:47,h:22,font:"Noto Sans JP",fontSize:8,weight:400,line:1.5});
addObject("shape",{name:"QR背景",shape:"rect",x:62,y:31,w:17,h:17,fill:"#ffffff",stroke:"#ffffff",strokeWidth:0,radius:1});
state.history=[];state.future=[];state.selected=null;renderData();renderAll();setTimeout(fitCanvas,50);
</script>
